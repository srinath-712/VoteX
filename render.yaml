services:
  - type: web
    name: votex
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false # Requires manual setup in Render Dashboard
      - key: CORS_ORIGIN
        sync: false # Requires manual setup in Render Dashboard
